<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A3F47"/>
      <stop offset="50%" stop-color="#262A30"/>
      <stop offset="100%" stop-color="#16181B"/>
    </linearGradient>
    <linearGradient id="cardFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E333A"/>
      <stop offset="100%" stop-color="#1C1F24"/>
    </linearGradient>
    <linearGradient id="pencilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#42A5F5"/>
      <stop offset="50%" stop-color="#1976D2"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
    <linearGradient id="wrenchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECEFF1"/>
      <stop offset="50%" stop-color="#CFD8DC"/>
      <stop offset="100%" stop-color="#90A4AE"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- PS2 Memory Card Body -->
  <g filter="url(#dropShadow)">
    <!-- Outer Card Shell (Isometric Rounded Rectangle) -->
    <path d="M 120 40 
             L 392 40 
             A 32 32 0 0 1 424 72 
             L 424 400 
             L 404 430 
             L 384 410 
             L 364 430 
             L 344 410 
             L 324 430 
             L 188 430 
             L 168 410 
             L 148 430 
             L 128 410 
             L 108 430 
             L 88 400 
             L 88 72 
             A 32 32 0 0 1 120 40 Z" 
          fill="url(#cardGrad)" stroke="#4F5661" stroke-width="4"/>

    <!-- Top Thumb Grip Notch -->
    <path d="M 216 40 L 296 40 L 280 64 L 232 64 Z" fill="#14171A" opacity="0.8"/>

    <!-- Inner Label / Card Face Recess -->
    <rect x="120" y="80" width="272" height="310" rx="16" fill="url(#cardFace)" stroke="#16181B" stroke-width="3"/>

    <!-- MagicGate PS2 Card Grips (Side Notches) -->
    <rect x="88" y="140" width="8" height="24" rx="4" fill="#14171A"/>
    <rect x="88" y="180" width="8" height="24" rx="4" fill="#14171A"/>
    <rect x="416" y="140" width="8" height="24" rx="4" fill="#14171A"/>
    <rect x="416" y="180" width="8" height="24" rx="4" fill="#14171A"/>

    <!-- Memory Card Top Header Groove -->
    <path d="M 140 100 L 372 100" stroke="#16181B" stroke-width="3" stroke-linecap="round"/>

    <!-- Wrench Tool (Diagonal Left-Right) -->
    <g transform="rotate(-35 256 240)">
      <!-- Wrench Handle -->
      <rect x="238" y="150" width="36" height="180" rx="8" fill="url(#wrenchGrad)" stroke="#78909C" stroke-width="2"/>
      <!-- Wrench Left Head -->
      <path d="M 230 150 C 210 130 220 100 240 90 C 255 105 270 105 285 90 C 300 100 310 130 290 150 Z" 
            fill="url(#wrenchGrad)" stroke="#78909C" stroke-width="2"/>
      <!-- Wrench Right Head -->
      <path d="M 230 330 C 210 350 220 380 240 390 C 255 375 270 375 285 390 C 300 380 310 350 290 330 Z" 
            fill="url(#wrenchGrad)" stroke="#78909C" stroke-width="2"/>
    </g>

    <!-- Pencil Tool (Vertical / Cross) -->
    <g transform="translate(0, 0)">
      <!-- Eraser Tip Top -->
      <path d="M 238 120 L 274 120 A 8 8 0 0 1 282 128 L 282 145 L 230 145 L 230 128 A 8 8 0 0 1 238 120 Z" fill="#E0E0E0"/>
      <!-- Eraser Ferrule Metal Band -->
      <rect x="230" y="145" width="52" height="14" fill="#9E9E9E"/>
      <rect x="230" y="152" width="52" height="2" fill="#616161"/>

      <!-- Pencil Hexagonal Body -->
      <rect x="230" y="159" width="52" height="150" fill="url(#pencilGrad)" stroke="#0D47A1" stroke-width="1.5"/>
      <!-- Body Facet Shading Lines -->
      <line x1="247" y1="159" x2="247" y2="309" stroke="#42A5F5" stroke-width="2"/>
      <line x1="265" y1="159" x2="265" y2="309" stroke="#0D47A1" stroke-width="2"/>

      <!-- Pencil Wood Collar -->
      <polygon points="230,309 282,309 256,355" fill="#FFE0B2"/>
      <!-- Pencil Graphite/Lead Tip (PlayStation Blue Lead) -->
      <polygon points="246,337 266,337 256,355" fill="#0D47A1"/>
    </g>
  </g>
</svg>
